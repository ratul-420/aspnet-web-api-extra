<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To-do CRUD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 6px 12px; }
    #editForm { display: none; margin: 1rem 0; padding: 1rem; border: 1px solid #888; }
  </style>
</head>
<body>
  <h1>To-do CRUD</h1>

  <h3>Add</h3>
  <form action="javascript:void(0);" onsubmit="addItem()">
    <input type="text" id="add-name" placeholder="New to-do">
    <input type="submit" value="Add">
  </form>

  <div id="editForm">
    <h3>Edit</h3>
    <form action="javascript:void(0);" onsubmit="updateItem()">
      <input type="hidden" id="edit-id">
      <label><input type="checkbox" id="edit-isComplete"> Complete</label>
      <input type="text" id="edit-name">
      <input type="submit" value="Save">
      <a href="#" onclick="closeInput()">Close</a>
    </form>
  </div>

  <p id="counter"></p>

  <table>
    <tr>
      <th>Complete?</th>
      <th>Name</th>
      <th></th>
      <th></th>
    </tr>
    <tbody id="todos"></tbody>
  </table>

  <script src="site.js"></script>
</body>
</html>
